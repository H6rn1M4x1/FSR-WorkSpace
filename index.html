    <script>
      // Apply favicon on load with transparent background and device-specific theme color
      (function() {
        try {
          var themeColor = localStorage.getItem("theme_color") || "#8ab4f8";
          var svgIcon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%"><path d="M 256,80 Q 256,256 432,256 Q 256,256 256,432 Q 256,256 80,256 Q 256,256 256,80 Z" fill="' + themeColor + '" stroke="' + themeColor + '" stroke-width="4" stroke-linejoin="round"/></svg>';
          var svgBlob = new Blob([svgIcon], { type: "image/svg+xml" });
          var svgUrl = URL.createObjectURL(svgBlob);
          var iconLinks = document.querySelectorAll("link[rel='icon'], link[rel='apple-touch-icon']");
          iconLinks.forEach(function(link) {
            link.href = svgUrl;
          });
        } catch(e) {}
      })();
    </script>
    <script>
      // Prevent unhandled Cannot redefine property errors from browser extensions
      (function() {
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (e) {
              if (e && e.message && (e.message.includes('redefine property') || e.message.includes('ethereum'))) {
                return obj;
              }
              throw e;
            }
          };
        } catch (e) {}
      })();
    </script>
  </head>

  </body>
