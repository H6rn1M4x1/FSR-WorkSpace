<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    position: relative;
    width: 300px;
    height: 100px;
    background: white;
  }
  .waveform {
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(90deg, #888, #888 2px, transparent 2px, transparent 4px);
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: var(--color-primary, red);
    mix-blend-mode: screen; /* or color? or multiply? */
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="waveform"></div>
    <div class="overlay"></div>
  </div>
</body>
</html>
